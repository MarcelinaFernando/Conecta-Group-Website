<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Group</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter (300, 400, 500, 600, 700, 800) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body>

    <!-- ===== Header Section ===== -->
        <header class="header">
            <!-- Logo image -->
        <img src="assets/icons/logo.png" alt="Grupo Conecta logo" class="logo" />

        <!-- Menu button for mobile navigation -->
        <button class="menu-btn">
            <img src="assets/icons/icon.png" alt="Open menu" class="menu-icon" />
        </button>
        </header>

    
    <main>
        <!-- ===== Hero Section ===== -->
        <section class="hero">
        <!-- Background image -->
            <div class="hero-overlay"></div>
            <!-- Text and buttons -->
                <div class="hero-content">
                    <h1 class="hero-title">Transforme seu potencial em realidade</h1>
                    <p class="hero-subtitle">
                    Programas educacionais que desenvolvem habilidades
                    </p>
                    <!-- Buttons -->
                        <div class="hero-buttons">
                        <button class="btn btn-primary">Explorar programas</button>
                    </div>
        </div>
    </section>

        <!-- ===== Value Proposition Section ===== -->
    <section class="value-section">
        <h2 class="section-title-value">Nossa Proposta de Valor</h2>

        <!-- The cards will be rendered here via JavaScript -->
        <div class="value-cards" id="valueCardsContainer"></div>
    </section>

    <!-- Courses and Workshops Section -->
    <section class="courses-section">
        <h2 class="section-title-courses">Cursos e Workshops</h2>
        <p class="section-subtitle-courses">Conheça nossos programas educacionais</p>

        <div id="courses-container" class="courses-container">
        <!-- The cards will be rendered here via JavaScript -->
        </div>

        <div class="see-all-wrapper">
            <a href="#" class="see-all-button">Ver todos os programas</a>
        </div>
    </section>



</main>

<script src="script.js"></script> 
</body>
</html>
